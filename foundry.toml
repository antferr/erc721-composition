[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
# reproducible gas figures: every top-level call is its own transaction, and contract
# creations in tests are real creations, not cheatcode deployments
isolate = true
dynamic_test_linking = false
fs_permissions = [{ access = "read", path = "./test/data" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = true
